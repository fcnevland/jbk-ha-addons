    name: Adres van het portaal
    description: Laat dit staan op https://mijn.keukenadviesaanhuis-assen.nl
  robot_sleutel:
    name: Robotsleutel
    description: Maak je in het dashboard onder Bestellingen → Bestelrobot (begint met jbr_).
